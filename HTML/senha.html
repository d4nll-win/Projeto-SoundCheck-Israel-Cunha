
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCheck | Recuperar Senha</title>
    <link rel="stylesheet" href="../CSS/login2.css">
</head>

<body class="pagina-acesso">

    <main id="recuperacao">

        <h1>SoundCheck</h1>
        <h2>Esqueceu sua senha?</h2>

        <p>
            Informe o e-mail cadastrado na sua conta.
            Assim, poderemos ajudar você a recuperar seu acesso.
        </p>

        <form action="trocar-senha.html" method="get">

            <label for="email">E-mail cadastrado:</label>
            <input type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" required>

            <button type="submit">Recuperar senha</button>

        </form>

        <div class="links-acesso">
            <a href="login.html">Voltar para o login</a>
        </div>

    </main>

</body>
</html>
