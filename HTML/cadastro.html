<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCheck | Cadastro</title>
    <link rel="stylesheet" href="../CSS/login2.css">
</head>

<body class="pagina-acesso">

    <main id="cadastro-conta">

        <h1>SoundCheck</h1>
        <h2>Crie sua conta</h2>

        <p>Preencha os campos abaixo para começar.</p>

        <form action="telainicial.html" method="get">

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email-cadastro">E-mail:</label>
            <input type="email" id="email-cadastro" name="email" placeholder="Digite seu e-mail" required>

            <label for="senha-cadastro">Senha:</label>
            <input type="password" id="senha-cadastro" name="senha" placeholder="Crie uma senha" required>

            <label for="confirmar-senha">Confirmar senha:</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite a senha novamente"
                required>

            <button type="submit">Criar conta</button>

        </form>

        <div class="links-acesso">
            <a href="login.html">Já possui uma conta? Entre aqui.</a>
        </div>

    </main>

</body>

</html>
