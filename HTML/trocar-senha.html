
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCheck | Trocar Senha</title>

    <link rel="stylesheet" href="../CSS/trocar-senha.css">
</head>

<body class="pagina-acesso">

    <main id="trocar-senha">

        <h1>SoundCheck</h1>

        <h2>Crie uma nova senha</h2>

        <p>
            Escolha uma nova senha para recuperar o acesso
            à sua conta.
        </p>

        <form action="login.html" method="get">

            <label for="nova-senha">Nova senha:</label>
            <input
                type="password"
                id="nova-senha"
                name="nova-senha"
                placeholder="Digite sua nova senha"
                required
                minlength="8"
            >

            <label for="confirmar-nova-senha">Confirmar nova senha:</label>
            <input
                type="password"
                id="confirmar-nova-senha"
                name="confirmar-nova-senha"
                placeholder="Digite a senha novamente"
                required
                minlength="8"
            >

            <button type="submit">Alterar senha</button>

        </form>

        <div class="links-acesso">
            <a href="login.html">Voltar para o login</a>
        </div>

    </main>

</body>
</html>
